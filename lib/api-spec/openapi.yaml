components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ---- USER ----
    User:
      type: object
      required: [id, name, email, role, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, moderator, group_owner, member]
        status:
          type: string
          enum: [active, suspended, banned]
        location:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        createdAt:
          type: string

    UserInput:
      type: object
      required: [name, password]
      properties:
        name:
          type: string
        nickname:
          type: string
        email:
          type: string
        phone:
          type: string
        password:
          type: string
        location:
          type: string
        bio:
          type: string

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        nickname:
          type: string
        bio:
          type: string
        location:
          type: string
        role:
          type: string
        status:
          type: string
        preferredLanguage:
          type: string

    UserDashboard:
      type: object
      required: [userId, discussionCount, commentCount, groupCount, helpRequestCount, volunteerActivityCount, notificationCount, savedCount]
      properties:
        userId:
          type: integer
        discussionCount:
          type: integer
        commentCount:
          type: integer
        groupCount:
          type: integer
        helpRequestCount:
          type: integer
        volunteerActivityCount:
          type: integer
        notificationCount:
          type: integer
        savedCount:
          type: integer
        recentDiscussions:
          type: array
          items:
            $ref: "#/components/schemas/Discussion"
        recentGroups:
          type: array
          items:
            $ref: "#/components/schemas/Group"

    # ---- DISCUSSION ----
    Discussion:
      type: object
      required: [id, title, content, category, authorId, authorName, likes, views, commentCount, isLocked, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        category:
          type: string
          description: Optional free-text topic. The API may prefix newly entered topics with u: internally; clients should display the decoded text.
        authorId:
          type: integer
        authorName:
          type: string
        likes:
          type: integer
        views:
          type: integer
        commentCount:
          type: integer
        isLocked:
