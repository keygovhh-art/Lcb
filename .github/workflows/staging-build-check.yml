name: Gavhah staging build check
on:
  push:
    branches:
      - feature/forum-free-topics-admin-workflow-20261008
      - fix/restore-campaigns-custom-help-20261009
      - fix/admin-mobile-actions-20261011
      - fix/restore-founder-reports-help-20261011
      - fix/react-page-crash-root-and-error-noise-20261011
      - feature/charity-queue-schedules-phone-donation-20261012
      - fix/my-askanus-followup-history-delete-20261013
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install exactly locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check frontend and API TypeScript
        run: pnpm run typecheck
      - name: Build frontend and API exactly as Render
        run: |
          pnpm --filter @workspace/gavhah run build
          pnpm --filter @workspace/api-server run build
      - name: Verify staged charity scheduling, private queue and donation buttons
        run: node --experimental-strip-types --test tests/charity-publishing.test.mjs
      - name: Verify optional own donation safety gates, amounts and admin controls
        run: node --experimental-strip-types --test tests/native-charity-donations.test.mjs
      - name: Verify joined official causes and personal case workflow
        run: node --test tests/official-cause-join.test.mjs
      - name: Verify follow-up history, owner-only deletion and undo completion
        run: node --experimental-strip-types --test tests/case-followup-history.test.mjs
      - name: Verify independent weekday selections for each minyan
        run: node --experimental-strip-types --test tests/minyan-weekdays.test.mjs
      - name: Verify group moderation, founder rights and report-target confidentiality
        run: node --test tests/groups-advanced.test.mjs
      - name: Verify member My Creations privacy and independent help roles
        run: node --test tests/my-profile-created-content.test.mjs
      - name: Verify optional and multiple minyan schedule form and API
        run: node --experimental-strip-types --test tests/minyan-schedules.test.mjs
      - name: Verify real crash prevention and error-noise filtering
        run: node --experimental-strip-types --test tests/react-page-crash-protection.test.mjs
      - name: Verify nickname and anonymous posting identity
        run: node --experimental-strip-types --test tests/public-posting-identity.test.mjs
      - name: Verify linked account and immutable posting identities
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const read=p=>fs.readFileSync(p,'utf8');
          const auth=read('artifacts/api-server/src/routes/auth.ts');
          const ui=read('artifacts/gavhah/src/components/shared/account-switcher.tsx');
          const dir=read('artifacts/gavhah/src/pages/directory/index.tsx');
          assert(auth.includes('"/auth/accounts/switch"'));
          assert(auth.includes('"/auth/accounts/add"'));
          assert(auth.includes('req.session.regenerate('));
          assert(auth.includes('linkedPasswordVersions'));
          assert(auth.includes('Account password changed; please verify this account again'));
          assert(auth.includes('verifyAccount(req.body?.identifier,req.body?.password)'));
          const authUi=read('artifacts/gavhah/src/context/auth-context.tsx');
          assert(authUi.includes('window.location.reload()'));
          const resolver=read('artifacts/api-server/src/lib/user-display.ts');
          assert(!resolver.includes('allowed.includes(cleanRequested)'));

          assert(auth.includes('verifyPassword(password,user.passwordHash)'));
          assert(!ui.includes('localStorage'));
          assert((dir.match(/<ActiveAccountIdentity/g)||[]).length >= 4);
          assert(!dir.includes('onChange={set("userName")}'));
          assert(!dir.includes('onChange={set("organizerName")}'));
          console.log('Account switching and immutable identity safeguards verified');
          NODE
      - name: Verify admin mobile interactions
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const admin = fs.readFileSync('artifacts/gavhah/src/pages/admin/index.tsx','utf8');
          const inbox = fs.readFileSync('artifacts/gavhah/src/components/admin/operations-inbox.tsx','utf8');
          const matching = fs.readFileSync('artifacts/gavhah/src/components/admin/private-assistance-management.tsx','utf8');
          const gates = fs.readFileSync('artifacts/gavhah/src/components/admin/membership-gate-management.tsx','utf8');
          const reporter = fs.readFileSync('artifacts/gavhah/src/components/shared/report-button.tsx','utf8');
          const backend = fs.readFileSync('artifacts/api-server/src/routes/private-assistance.ts','utf8');
          assert(admin.includes('useState("overview")'));
          assert(admin.includes('flex flex-wrap h-auto gap-1 p-1'));
          assert(!admin.includes('admin-section-select'));
          assert(inbox.includes('operations-filter'));
          assert(inbox.includes('pendingConfirmation'));
          assert(inbox.includes('availableVolunteers.map'));
          assert(matching.includes('pendingMatch'));
          assert(matching.includes('onOpenOperations'));
          assert(matching.includes('requestPrivateContact'));
          assert(reporter.includes('response.status === 409'));
          assert(reporter.includes('role="alert"'));
          assert(backend.includes('request-contact-details'));
          assert(backend.includes('availableActiveVolunteers'));
          assert(gates.includes('setPending({type:"publish"})'));
          for(const file of [admin,inbox,matching,gates]) assert(!file.includes('window.confirm('));
          console.log('Verified restored admin Overview, reports, private help cases and confirmations');
          NODE
