name: Gavhah independent Cloudflare Worker runtime smoke test

on:
  pull_request:
    paths:
      - 'cloudflare/gavhah/**'
      - 'artifacts/api-server/src/**'
      - 'lib/db/**'
      - '.github/workflows/gavhah-cloudflare-native-worker-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-worker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build frontend static assets
        run: pnpm --filter @workspace/gavhah run build
      - name: Embed original Vite website assets in the independent Worker
        run: node cloudflare/gavhah/build-inline-assets.mjs
      - name: Compile native Express + Neon Cloudflare Worker without any deploy
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.native-cloudflare"
          pnpm dlx wrangler deploy --config cloudflare/gavhah/wrangler.jsonc --dry-run --outdir "$GITHUB_WORKSPACE/.native-cloudflare"
          find "$GITHUB_WORKSPACE/.native-cloudflare" -maxdepth 2 -type f -printf 'Compiled asset: %p %s bytes\n' | head -n 30
          test -n "$(find "$GITHUB_WORKSPACE/.native-cloudflare" -maxdepth 2 -name '*.js' -type f -print -quit)"
      - name: Start worker in local workerd and smoke /api route without touching Neon
        env:
          DATABASE_URL: postgresql://dummy:dummy@127.0.0.1:5432/dummy
          SESSION_SECRET: local-only-smoke-session-secret-that-cannot-be-production
          SESSION_STORE: postgres
          SESSION_COOKIE_SECURE: 'true'
          YEMOT_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          set -u
          pnpm dlx wrangler dev --config cloudflare/gavhah/wrangler.jsonc --local --port 8812 \
            --var DATABASE_URL:"$DATABASE_URL" \
            --var SESSION_SECRET:"$SESSION_SECRET" \
            --var SESSION_STORE:postgres \
            --var SESSION_COOKIE_SECURE:true \
            --var YEMOT_ENCRYPTION_KEY:"$YEMOT_ENCRYPTION_KEY" > /tmp/gavhah-worker-smoke.log 2>&1 &
          child=$!
          trap 'kill "$child" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do
            status=$(curl --max-time 2 -s -o /tmp/gavhah-worker-smoke-body -w '%{http_code}' http://127.0.0.1:8812/api/nonexistent || true)
            if [ "$status" = "503" ]; then
              home_status=$(curl --compressed --max-time 4 -s -o /tmp/gavhah-worker-home -w '%{http_code}' http://127.0.0.1:8812/ || true)
              readiness_status=$(curl --max-time 4 -s -o /tmp/gavhah-worker-status -w '%{http_code}' http://127.0.0.1:8812/__gavhah/status || true)
              echo "API HTTP status: $status, homepage HTTP status: $home_status, readiness HTTP status: $readiness_status"
              echo "Homepage first 80 bytes after HTTP decoding: $(head -c 80 /tmp/gavhah-worker-home)"
              echo "API JSON body: $(head -c 320 /tmp/gavhah-worker-smoke-body)"
              echo "Readiness JSON body: $(head -c 320 /tmp/gavhah-worker-status)"
              if [ "$home_status" = "200" ] && grep -q '<html' /tmp/gavhah-worker-home &&
                 [ "$readiness_status" = "200" ] && grep -q '"databaseCredentialsConfigured":false' /tmp/gavhah-worker-status &&
                 grep -q 'awaiting its Neon' /tmp/gavhah-worker-smoke-body; then
                echo "Independent Cloudflare React app serves successfully; API and hotline correctly locked until genuine Neon/provider secrets are supplied."
                exit 0
              fi
              echo "Native Worker check failed: home=$home_status status=$readiness_status api=$status"
              echo "Homepage first bytes:"; head -c 400 /tmp/gavhah-worker-home || true; echo
              echo "Readiness response:"; head -c 400 /tmp/gavhah-worker-status || true; echo
              echo "API response:"; head -c 400 /tmp/gavhah-worker-smoke-body || true; echo
              exit 1
            fi
            if ! kill -0 "$child" 2>/dev/null; then
              echo "Native Worker process failed to start"; tail -n 120 /tmp/gavhah-worker-smoke.log; exit 1
            fi
            sleep 2
          done
          echo "Native Worker did not serve expected API response"
          tail -n 120 /tmp/gavhah-worker-smoke.log
          exit 1
      - name: Save compiled native Worker bundle for secure preview deploy
        uses: actions/upload-artifact@v4
        with:
          name: gavhah-native-worker-bundle
          path: .native-cloudflare/
          retention-days: 3
          include-hidden-files: true
      - name: Export secret-free compiled native Worker gzip chunks for locked staging deploy
        run: |
          test -s .native-cloudflare/worker.js
          echo "GAVHAH_WORKER_SHA256:$(sha256sum .native-cloudflare/worker.js | cut -d' ' -f1)"
          gzip -c .native-cloudflare/worker.js | base64 -w0 | fold -w 32000 |
            awk '{printf "GAVHAH_B64_PART_%03d:%s\\n", NR-1, $0;} END {printf "GAVHAH_TOTAL_PARTS:%d\\n",NR}'
      - name: Report only native Worker bundle size (no secrets)
        run: |
          find .native-cloudflare -type f -name '*.js' -exec sh -c 'printf "JS_BUNDLE_BYTES="; wc -c < "$1"; printf "GZIP_BUNDLE_BYTES="; gzip -c "$1" | wc -c' sh {} \;
