name: Gavhah staging build check
on:
  push:
    branches:
      - feature/forum-free-topics-admin-workflow-20261008
      - fix/restore-campaigns-custom-help-20261009
      - fix/admin-mobile-actions-20261011
      - fix/restore-founder-reports-help-20261011
      - fix/stabilize-react-blank-pages-batch-20261011
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install exactly locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check frontend and API TypeScript
        run: pnpm run typecheck
      - name: Build frontend and API exactly as Render
        run: |
          pnpm --filter @workspace/gavhah run build
          pnpm --filter @workspace/api-server run build
      - name: Verify admin mobile interactions
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const admin = fs.readFileSync('artifacts/gavhah/src/pages/admin/index.tsx','utf8');
          const inbox = fs.readFileSync('artifacts/gavhah/src/components/admin/operations-inbox.tsx','utf8');
          const matching = fs.readFileSync('artifacts/gavhah/src/components/admin/private-assistance-management.tsx','utf8');
          const gates = fs.readFileSync('artifacts/gavhah/src/components/admin/membership-gate-management.tsx','utf8');
          const reporter = fs.readFileSync('artifacts/gavhah/src/components/shared/report-button.tsx','utf8');
          const backend = fs.readFileSync('artifacts/api-server/src/routes/private-assistance.ts','utf8');
          assert(admin.includes('useState("overview")'));
          assert(admin.includes('flex flex-wrap h-auto gap-1 p-1'));
          assert(!admin.includes('admin-section-select'));
          assert(inbox.includes('operations-filter'));
          assert(inbox.includes('pendingConfirmation'));
          assert(inbox.includes('availableVolunteers.map'));
          assert(matching.includes('pendingMatch'));
          assert(matching.includes('onOpenOperations'));
          assert(matching.includes('requestPrivateContact'));
          assert(reporter.includes('response.status === 409'));
          assert(reporter.includes('role="alert"'));
          assert(backend.includes('request-contact-details'));
          assert(backend.includes('availableActiveVolunteers'));
          assert(gates.includes('setPending({type:"publish"})'));
          for(const file of [admin,inbox,matching,gates]) assert(!file.includes('window.confirm('));
          console.log('Verified restored admin Overview, reports, private help cases and confirmations');
          NODE

      - name: Verify page stability and error reporter regression safeguards
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const html=fs.readFileSync('artifacts/gavhah/index.html','utf8');
          const app=fs.readFileSync('artifacts/gavhah/src/App.tsx','utf8');
          const reporter=fs.readFileSync('artifacts/gavhah/src/lib/system-error-reporter.ts','utf8');
          const api=fs.readFileSync('artifacts/api-server/src/routes/system-errors.ts','utf8');
          assert(html.includes('translate="no"'));
          assert(html.includes('name="google" content="notranslate"'));
          assert(app.includes('<AppErrorBoundary key={route}>'));
          assert(app.includes('expectedCancellation'));
          assert(reporter.includes('isExpectedCancellation'));
          assert(!reporter.includes('addEventListener("submit"'));
          assert(!reporter.includes('event.preventDefault()'));
          assert(api.includes('expected_request_cancellation'));
          console.log('Page root stability and automatic report regression checks passed');
          NODE
