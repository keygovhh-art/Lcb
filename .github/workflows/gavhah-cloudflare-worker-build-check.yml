name: Gavhah Cloudflare hosting-only staging build

on:
  pull_request:
    paths:
      - 'cloudflare/gavhah/**'
      - 'artifacts/api-server/src/**'
      - 'artifacts/gavhah/**'
      - 'lib/db/**'
      - '.github/workflows/gavhah-cloudflare-worker-build-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    name: Bundle original Gavhah + Neon API for Cloudflare (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cloudflare read-only preview does not leak visitor credentials or allow writes
        run: node --test tests/gavhah-cloudflare-mirror.test.mjs
      - name: Functional Cloudflare copy authentication/CSRF/phone-proxy safety tests
        run: node --test tests/gavhah-cloudflare-full-web.test.mjs
      - name: Existing Gavhah Vite app builds unchanged
        run: pnpm --filter @workspace/gavhah run build
      - name: Inline the exact production React SPA into native Worker
        run: node cloudflare/gavhah/build-inline-assets.mjs
      - name: Existing API typecheck
        run: pnpm --filter @workspace/api-server run typecheck
      - name: Workers Node compatibility / static assets bundle without deploy
        run: pnpm dlx wrangler deploy --config cloudflare/gavhah/wrangler.jsonc --dry-run --outdir .cloudflare-dry-run
      - name: Inspect full native Cloudflare bundle sizes safely
        run: |
          find .cloudflare-dry-run -maxdepth 3 -type f -printf '%p %s bytes\n' | head -n 20
          find .cloudflare-dry-run -type f -name '*.js' -exec sh -c 'echo "script $1 bytes: $(wc -c < "$1")"; echo "gzip bytes: $(gzip -c "$1" | wc -c)"' sh {} \;
      - name: Confirm no Render proxy or Neon mutation added
        run: |
          grep -q '"main": "./worker.ts"' cloudflare/gavhah/wrangler.jsonc
          grep -q 'generated-static-assets' cloudflare/gavhah/worker.ts
          ! grep -ER 'onrender\.com|CREATE TABLE|DROP TABLE|TRUNCATE' cloudflare/gavhah/worker.ts cloudflare/gavhah/wrangler.jsonc
