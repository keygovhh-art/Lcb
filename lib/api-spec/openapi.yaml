openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Gavhah Community Kindness Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: discussions
    description: Askanim Forum discussions
  - name: news
    description: Global Chesed News
  - name: groups
    description: Community Groups
  - name: minyans
    description: Minyan Center
  - name: volunteers
    description: Activists Directory
  - name: charity
    description: Today's Charity
  - name: stats
    description: Community Dashboard statistics
  - name: featured-causes
    description: United In Kindness featured cause
  - name: community-projects
    description: Activists Directory community projects
  - name: announcements
    description: Platform announcements
  - name: reports
    description: Content moderation reports
  - name: notifications
    description: User notifications

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ---- USERS ----
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      parameters:
        - in: query
          name: role
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /users/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}/ban:
    post:
      operationId: banUser
      tags: [users]
      summary: Ban a user (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User banned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}/suspend:
    post:
      operationId: suspendUser
      tags: [users]
      summary: Suspend a user (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}/dashboard:
    get:
      operationId: getUserDashboard
      tags: [users]
      summary: Get personal dashboard for a user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDashboard"

  # ---- DISCUSSIONS (Askanim Forum) ----
  /discussions:
    get:
      operationId: listDiscussions
      tags: [discussions]
      summary: List forum discussions
      parameters:
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: trending
          schema:
            type: boolean
        - in: query
          name: page
          schema:
            type: integer
      responses:
        "200":
          description: List of discussions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Discussion"
    post:
      operationId: createDiscussion
      tags: [discussions]
      summary: Create a new discussion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscussionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discussion"

  /discussions/{id}:
    get:
      operationId: getDiscussion
      tags: [discussions]
      summary: Get discussion by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Discussion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discussion"
    patch:
      operationId: updateDiscussion
      tags: [discussions]
      summary: Update a discussion
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscussionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discussion"
    delete:
      operationId: deleteDiscussion
      tags: [discussions]
      summary: Delete a discussion
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /discussions/{id}/like:
    post:
      operationId: likeDiscussion
      tags: [discussions]
      summary: Like a discussion
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Liked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResult"

  /discussions/{id}/lock:
    post:
      operationId: lockDiscussion
      tags: [discussions]
      summary: Lock a discussion (moderator/admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discussion"

  /discussions/{id}/comments:
    get:
      operationId: listDiscussionComments
      tags: [discussions]
      summary: List comments for a discussion
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createDiscussionComment
      tags: [discussions]
      summary: Comment on a discussion
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /discussions/trending:
    get:
      operationId: getTrendingDiscussions
      tags: [discussions]
      summary: Get trending discussions
      responses:
        "200":
          description: Trending discussions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Discussion"

  # ---- CAUSE SUPPORTERS ----
  /cause-supporters:
    get:
      operationId: listCauseSupporters
      tags: [cause-supporters]
      summary: List supporters for a cause
      parameters:
        - name: causeType
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of supporters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CauseSupporter"
    post:
      operationId: joinCause
      tags: [cause-supporters]
      summary: Join a cause as a supporter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CauseSupporterInput"
      responses:
        "201":
          description: Supporter created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CauseSupporter"

  # ---- FEATURED CAUSES ----
  /featured-causes:
    get:
      operationId: listFeaturedCauses
      tags: [featured-causes]
      summary: List featured causes
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of featured causes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeaturedCause"
    post:
      operationId: createFeaturedCause
      tags: [featured-causes]
      summary: Create a featured cause (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeaturedCauseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeaturedCause"

  /featured-causes/active:
    get:
      operationId: getActiveFeaturedCause
      tags: [featured-causes]
      summary: Get the currently active featured cause
      responses:
        "200":
          description: Active cause
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeaturedCause"

  /featured-causes/{id}:
    get:
      operationId: getFeaturedCause
      tags: [featured-causes]
      summary: Get a featured cause by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Featured cause
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeaturedCause"
    patch:
      operationId: updateFeaturedCause
      tags: [featured-causes]
      summary: Update a featured cause (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeaturedCauseInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeaturedCause"

  /featured-causes/{id}/join:
    post:
      operationId: joinFeaturedCause
      tags: [featured-causes]
      summary: Join / support a featured cause
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeaturedCauseSupporterInput"
      responses:
        "201":
          description: Supporter registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeaturedCauseSupporter"

  /featured-causes/{id}/supporters:
    get:
      operationId: listFeaturedCauseSupporters
      tags: [featured-causes]
      summary: List supporters for a featured cause
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Supporters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeaturedCauseSupporter"

  /cause-submissions:
    post:
      operationId: submitCause
      tags: [featured-causes]
      summary: Submit a cause for review / future consideration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CauseSubmissionInput"
      responses:
        "201":
          description: Submission received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CauseSubmission"
    get:
      operationId: listCauseSubmissions
      tags: [featured-causes]
      summary: List submitted causes (admin)
      responses:
        "200":
          description: Submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CauseSubmission"

  # ---- COMMUNITY PROJECTS ----
  /community-projects:
    get:
      operationId: listCommunityProjects
      tags: [community-projects]
      summary: List community projects
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityProject"
    post:
      operationId: createCommunityProject
      tags: [community-projects]
      summary: Create a community project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityProject"

  /community-projects/{id}:
    get:
      operationId: getCommunityProject
      tags: [community-projects]
      summary: Get a project by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityProject"
    patch:
      operationId: updateCommunityProject
      tags: [community-projects]
      summary: Update a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityProjectInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityProject"
    delete:
      operationId: deleteCommunityProject
      tags: [community-projects]
      summary: Delete a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /community-projects/{id}/join:
    post:
      operationId: joinCommunityProject
      tags: [community-projects]
      summary: Join / volunteer for a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMemberInput"
      responses:
        "201":
          description: Member registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"

  /community-projects/{id}/members:
    get:
      operationId: listProjectMembers
      tags: [community-projects]
      summary: List members of a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMember"

  # ---- NEWS ----
  /news:
    get:
      operationId: listNews
      tags: [news]
      summary: List news articles
      parameters:
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: featured
          schema:
            type: boolean
        - in: query
          name: page
          schema:
            type: integer
      responses:
        "200":
          description: List of news articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsArticle"
    post:
      operationId: createNews
      tags: [news]
      summary: Create a news article
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsArticleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsArticle"

  /news/{id}:
    get:
      operationId: getNews
      tags: [news]
      summary: Get news article by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: News article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsArticle"
    patch:
      operationId: updateNews
      tags: [news]
      summary: Update a news article
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsArticleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsArticle"
    delete:
      operationId: deleteNews
      tags: [news]
      summary: Delete a news article
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /news/{id}/like:
    post:
      operationId: likeNews
      tags: [news]
      summary: Toggle like on a news article
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated like count
          content:
            application/json:
              schema:
                type: object
                required: [likeCount]
                properties:
                  likeCount:
                    type: integer

  /news/featured:
    get:
      operationId: getFeaturedNews
      tags: [news]
      summary: Get featured news stories
      responses:
        "200":
          description: Featured stories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsArticle"

  # ---- GROUPS ----
  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List community groups
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: privacy
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
      responses:
        "200":
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a new group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"

  /groups/{id}:
    get:
      operationId: getGroup
      tags: [groups]
      summary: Get group by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
    patch:
      operationId: updateGroup
      tags: [groups]
      summary: Update a group
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
    delete:
      operationId: deleteGroup
      tags: [groups]
      summary: Delete a group
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /groups/{id}/join:
    post:
      operationId: joinGroup
      tags: [groups]
      summary: Request to join a group
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Join request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMember"

  /groups/{id}/members:
    get:
      operationId: listGroupMembers
      tags: [groups]
      summary: List group members
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupMember"

  /groups/{id}/posts:
    get:
      operationId: listGroupPosts
      tags: [groups]
      summary: List posts in a group
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Group posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupPost"
    post:
      operationId: createGroupPost
      tags: [groups]
      summary: Create a post in a group
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupPostInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupPost"

  # ---- MINYANS ----
  /minyans:
    get:
      operationId: listMinyans
      tags: [minyans]
      summary: List minyan listings
      parameters:
        - in: query
          name: city
          schema:
            type: string
        - in: query
          name: country
          schema:
            type: string
        - in: query
          name: community
          schema:
            type: string
        - in: query
          name: synagogue
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
      responses:
        "200":
          description: List of minyans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Minyan"
    post:
      operationId: createMinyan
      tags: [minyans]
      summary: Submit a new minyan listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MinyanInput"
      responses:
        "201":
          description: Created (pending approval)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Minyan"

  /minyans/{id}:
    get:
      operationId: getMinyan
      tags: [minyans]
      summary: Get minyan by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Minyan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Minyan"
    patch:
