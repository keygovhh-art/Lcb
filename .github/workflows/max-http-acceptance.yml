name: MAX isolated HTTP and Postgres acceptance
on:
  push:
    branches:
      - feature/gavhah-max-integration-20261014
  workflow_dispatch:
jobs:
  full-http-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: qa_local_password
          POSTGRES_USER: qa_runner
          POSTGRES_DB: gavhah_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa_runner -d gavhah_qa"
          --health-interval 3s
          --health-timeout 4s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://qa_runner:qa_local_password@127.0.0.1:5432/gavhah_qa
      SESSION_SECRET: QA-ONLY-EPHEMERAL-GITHUB-ACTIONS-NOT-PRODUCTION-SECRET
      SESSION_STORE: memory
      NODE_ENV: development
      PORT: 35147
      SESSION_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build isolated database from Drizzle model, never touching production Neon
        run: pnpm --filter @workspace/db run push-force
      - name: Verify complete additive migration works twice on disposable Postgres
        env:
          MAX_MIGRATION_MODE: staging
        run: |
          node lib/db/scripts/max-additive-migrate.mjs
          node lib/db/scripts/max-additive-migrate.mjs
      - name: Build API server
        run: pnpm --filter @workspace/api-server run build
      - name: Start isolated API and verify it becomes healthy
        run: |
          node artifacts/api-server/dist/index.mjs > /tmp/gavhah-max-http-qa.log 2>&1 &
          echo $! > /tmp/gavhah-max-http-qa.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:35147/api/healthz > /dev/null; then
              echo "Isolated staging API healthy"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gavhah-max-http-qa.log
          exit 1
      - name: Test two accounts and complete MAX finance/follow-up/opt-out HTTP journey
        run: pnpm --filter @workspace/api-server exec node tests/max-http-e2e.mjs
      - name: Show server diagnostics if QA failed
        if: failure()
        run: tail -n 120 /tmp/gavhah-max-http-qa.log || true
